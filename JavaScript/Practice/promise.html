<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Example</title>
</head>
<body>
    

    <script>
        function fetchdata(){
            return new Promise((resolve, reject) =>{
                setTimeout(() => {
                    let data = "Hello Everyone!! i am Krunal Rathod!!";
                    resolve(data);
                }, 2000);
            })
        }

        async function getData(){
            let result = await fetchdata();
            console.log(result);
        }

        getData();
    </script>
</body>
</html>
